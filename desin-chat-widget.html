<!-- DESIN Chat Widget — Shadow DOM Edition v3 -->
<div id="desin-chat-root"></div>
<script>
(function () {
  const ROOT = document.getElementById('desin-chat-root');
  if (!ROOT) return;

  // Avoid duplicate initialization
  if (ROOT.dataset.dcwMounted === '1') return;
  ROOT.dataset.dcwMounted = '1';

  const SHADOW = ROOT.attachShadow({ mode: 'closed' });
  const WEBHOOK = 'https://treedwellingfruitfly-n8n.cloudfy.live/webhook/a02d50d5-3357-41ae-aab8-b1a4687b9b8e';

  const parseN8nReply = (data) => {
    if (typeof data === 'string') return data;
    if (Array.isArray(data)) {
      const first = data[0] || {};
      return first.output || first.reply || first.response || first.message || first.text || '';
    }
    if (data && typeof data === 'object') {
      return data.output || data.reply || data.response || data.message || data.text || '';
    }
    return '';
  };

  const sendToN8n = async (payload) => {
    const resp = await fetch(WEBHOOK, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) throw new Error(`Webhook status ${resp.status}`);
    const data = await resp.json();
    return parseN8nReply(data);
  };

  // Avatar 200px
  const AVATAR_URL = 'https://desin.immunewell.com.br/wp-content/uploads/2026/02/AVATAR-DESIN.webp';

  const STYLES = `
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :host { all: initial; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; color: #1a1a1a; }
    .dcw-fab { position: fixed; bottom: 28px; right: 28px; width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg, #360E0D 0%, #59201A 100%); border: none; cursor: pointer; z-index: 999999; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(54, 14, 13, 0.35), 0 2px 8px rgba(0,0,0,0.15); transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s; }
    .dcw-fab:hover { transform: scale(1.08); box-shadow: 0 6px 28px rgba(54, 14, 13, .45), 0 3px 12px rgba(0,0,0,.2); }
    .dcw-fab:active { transform: scale(0.95); }
    .dcw-fab svg { width: 28px; height: 28px; fill: none; stroke: #FFFAF6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s, opacity .25s; }
    .dcw-fab.open .fab-chat { opacity: 0; transform: rotate(90deg) scale(.5); position: absolute; }
    .dcw-fab.open .fab-close { opacity: 1; transform: rotate(0deg) scale(1); }
    .dcw-fab:not(.open) .fab-chat { opacity: 1; transform: rotate(0deg) scale(1); }
    .dcw-fab:not(.open) .fab-close { opacity: 0; transform: rotate(-90deg) scale(.5); position: absolute; }
    .dcw-badge { position: absolute; top: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%; background: #ef4444; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; animation: dcw-pulse 2s infinite; }
    @keyframes dcw-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
    .dcw-window { position: fixed; bottom: 100px; right: 28px; width: 420px; height: 600px; border-radius: 20px; background: #FFFAF6; box-shadow: 0 20px 60px rgba(54,14,13,.2),0 8px 24px rgba(0,0,0,.08),0 0 0 1px rgba(54,14,13,.06); z-index: 999998; display: flex; flex-direction: column; overflow: hidden; opacity: 0; transform: translateY(20px) scale(.95); pointer-events: none; transition: opacity .35s cubic-bezier(.16,1,.3,1), transform .35s cubic-bezier(.16,1,.3,1); }
    .dcw-window.visible { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
    .dcw-header { background: linear-gradient(135deg,#360E0D 0%,#59201A 100%); padding: 18px 20px; display:flex; align-items:center; gap:14px; }
    .dcw-header-avatar { width: 44px; height: 44px; border-radius: 50%; background: #4a1a15; display:flex; align-items:center; justify-content:center; color:#FFFAF6; font-weight:700; font-size:18px; overflow:hidden; border: 2px solid rgba(255,250,246,.2); }
    .dcw-header-avatar img,.dcw-msg-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
    .dcw-header-info { flex:1; min-width:0; }
    .dcw-header-name { color:#FFFAF6; font-size:16px; font-weight:700; }
    .dcw-header-status { color:rgba(255,250,246,.75); font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:6px; margin-top:2px; }
    .dcw-header-dot { width:8px; height:8px; border-radius:50%; background:#4ADE80; display:inline-block; animation:dcw-dot-pulse 2.5s ease-in-out infinite; }
    @keyframes dcw-dot-pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .dcw-header-chevron { width:36px; height:36px; border-radius:50%; background:rgba(255,250,246,.1); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .dcw-header-chevron svg { width:18px; height:18px; fill:none; stroke:#FFFAF6; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
    .dcw-form-screen { flex:1; display:flex; flex-direction:column; align-items:center; padding:32px 28px 28px; overflow-y:auto; }
    .dcw-form-screen.hidden,.dcw-chat-screen.hidden,.dcw-typing.hidden,.dcw-connecting.hidden { display:none; }
    .dcw-form-emoji { font-size:44px; margin-bottom:8px; line-height:1; }
    .dcw-form-title { font-size:22px; font-weight:700; color:#360E0D; margin-bottom:6px; }
    .dcw-form-subtitle { font-size:13.5px; color:rgba(54,14,13,.55); margin-bottom:28px; text-align:center; font-weight:500; }
    .dcw-form-group { width:100%; margin-bottom:20px; }
    .dcw-form-label { display:block; font-size:13px; font-weight:600; color:#360E0D; margin-bottom:7px; }
    .dcw-form-input { width:100%; height:48px; padding:0 16px; border:1.5px solid rgba(54,14,13,.15); border-radius:12px; background:#fff; font-size:14.5px; outline:none; }
    .dcw-form-hint { font-size:11.5px; color:rgba(54,14,13,.4); margin-top:5px; }
    .dcw-form-btn { width:70%; height:50px; border-radius:14px; background:linear-gradient(135deg,#360E0D 0%,#59201A 100%); color:#FFFAF6; font-size:15px; font-weight:700; border:none; cursor:pointer; margin-top:8px; }
    .dcw-form-error { color:#dc2626; font-size:12px; margin-top:4px; display:none; }
    .dcw-form-error.show { display:block; }
    .dcw-chat-screen { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .dcw-messages { flex:1; overflow-y:auto; padding:24px 20px 16px; display:flex; flex-direction:column; gap:14px; background: radial-gradient(ellipse at 10% 90%, rgba(89,32,26,.04) 0%, transparent 50%), radial-gradient(ellipse at 90% 10%, rgba(54,14,13,.03) 0%, transparent 50%), linear-gradient(180deg, rgba(255,250,246,.5) 0%, #F9FAFB 100%); }
    .dcw-msg-row { display:flex; align-items:flex-end; gap:10px; }
    .dcw-msg-row.agent { justify-content:flex-start; } .dcw-msg-row.user { justify-content:flex-end; }
    .dcw-msg-avatar { width:32px; height:32px; border-radius:50%; background:#4a1a15; overflow:hidden; }
    .dcw-bubble-wrap { max-width:78%; display:flex; flex-direction:column; }
    .dcw-bubble { padding:12px 16px; font-size:14px; line-height:1.55; overflow-wrap:break-word; }
    .dcw-msg-row.agent .dcw-bubble { background:#fff; color:#1a1a1a; border-radius:16px 16px 16px 4px; border:1px solid rgba(54,14,13,.06); }
    .dcw-msg-row.user .dcw-bubble { background:linear-gradient(135deg,#360E0D 0%,#4a1a15 100%); color:#FFFAF6; border-radius:16px 16px 4px 16px; }
    .dcw-msg-time { font-size:10.5px; color:rgba(54,14,13,.35); margin-top:5px; }
    .dcw-typing { display:flex; align-items:flex-end; gap:10px; padding:4px 20px 10px; }
    .dcw-typing-dots { display:flex; gap:5px; padding:12px 18px; background:#fff; border-radius:16px 16px 16px 4px; border:1px solid rgba(54,14,13,.06); }
    .dcw-typing-dot { width:7px; height:7px; border-radius:50%; background:rgba(54,14,13,.3); animation:dcw-typing-bounce 1.4s ease-in-out infinite; }
    .dcw-typing-dot:nth-child(2){animation-delay:.2s} .dcw-typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes dcw-typing-bounce { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-6px);opacity:1} }
    .dcw-input-bar { padding:14px 20px 18px; display:flex; align-items:center; gap:10px; background:#FFFAF6; border-top:1px solid rgba(54,14,13,.06); }
    .dcw-input-field { flex:1; height:44px; padding:0 16px; border:1.5px solid rgba(54,14,13,.12); border-radius:22px; background:#fff; font-size:14px; outline:none; }
    .dcw-send-btn { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#360E0D 0%,#59201A 100%); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .dcw-send-btn svg { width:20px; height:20px; fill:none; stroke:#FFFAF6; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .dcw-connecting { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; }
    .dcw-spinner { width:36px; height:36px; border:3px solid rgba(54,14,13,.1); border-top-color:#59201A; border-radius:50%; animation:dcw-spin .8s linear infinite; }
    @keyframes dcw-spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px){ .dcw-fab{bottom:16px;right:16px;width:56px;height:56px} .dcw-window{bottom:80px;right:8px;left:8px;width:auto;height:calc(100dvh - 96px);max-height:540px;border-radius:18px} }
  `;

  SHADOW.innerHTML = `
    <style>${STYLES}</style>
    <button class="dcw-fab" id="dcwFab">
      <svg class="fab-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <svg class="fab-close" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span class="dcw-badge" id="dcwBadge">1</span>
    </button>
    <div class="dcw-window" id="dcwWindow">
      <div class="dcw-header">
        <div class="dcw-header-avatar"><img src="${AVATAR_URL}" alt="A" onerror="this.style.display='none';this.parentElement.textContent='A';"></div>
        <div class="dcw-header-info"><div class="dcw-header-name">Assistente DESIN</div><div class="dcw-header-status"><span class="dcw-header-dot"></span> Online agora</div></div>
        <button class="dcw-header-chevron" id="dcwChevron"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      </div>
      <div class="dcw-form-screen" id="dcwFormScreen">
        <div class="dcw-form-emoji">👋</div><div class="dcw-form-title">Bem-vindo!</div><div class="dcw-form-subtitle">Preencha os dados abaixo para iniciar o atendimento:</div>
        <div class="dcw-form-group"><label class="dcw-form-label">Seu nome</label><input type="text" class="dcw-form-input" id="dcwName" placeholder="Digite seu nome completo" autocomplete="off"><div class="dcw-form-error" id="dcwNameErr">Por favor, insira seu nome</div></div>
        <div class="dcw-form-group"><label class="dcw-form-label">WhatsApp</label><input type="tel" class="dcw-form-input" id="dcwPhone" placeholder="(DDD) 9XXXX-XXXX" autocomplete="off"><div class="dcw-form-hint">Apenas números (DDD + número)</div><div class="dcw-form-error" id="dcwPhoneErr">Insira um número válido com DDD</div></div>
        <button class="dcw-form-btn" id="dcwFormBtn">Iniciar Atendimento</button>
      </div>
      <div class="dcw-connecting hidden" id="dcwConnecting"><div class="dcw-spinner"></div><div class="dcw-connecting-text">Conectando...</div></div>
      <div class="dcw-chat-screen hidden" id="dcwChatScreen">
        <div class="dcw-messages" id="dcwMessages"></div>
        <div class="dcw-typing hidden" id="dcwTyping"><div class="dcw-msg-avatar"><img src="${AVATAR_URL}" alt="A" onerror="this.style.display='none';this.parentElement.textContent='A';"></div><div class="dcw-typing-dots"><div class="dcw-typing-dot"></div><div class="dcw-typing-dot"></div><div class="dcw-typing-dot"></div></div></div>
        <div class="dcw-input-bar"><input type="text" class="dcw-input-field" id="dcwInput" placeholder="Digite sua mensagem..." autocomplete="off"><button class="dcw-send-btn" id="dcwSendBtn"><svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button></div>
      </div>
    </div>`;

  const $ = (id) => SHADOW.getElementById(id);
  const fab = $('dcwFab'); const badge = $('dcwBadge'); const win = $('dcwWindow'); const chevron = $('dcwChevron');
  const formScreen = $('dcwFormScreen'); const connectingScreen = $('dcwConnecting'); const chatScreen = $('dcwChatScreen');
  const nameInput = $('dcwName'); const phoneInput = $('dcwPhone'); const nameErr = $('dcwNameErr'); const phoneErr = $('dcwPhoneErr'); const formBtn = $('dcwFormBtn');
  const messagesArea = $('dcwMessages'); const typingEl = $('dcwTyping'); const chatInput = $('dcwInput'); const sendBtn = $('dcwSendBtn');

  let isOpen = false; let sessionId = null; let userName = '';
  const toggleChat = () => { isOpen = !isOpen; fab.classList.toggle('open', isOpen); win.classList.toggle('visible', isOpen); if (isOpen) { badge.style.display = 'none'; setTimeout(() => (!chatScreen.classList.contains('hidden') ? chatInput : nameInput).focus(), 250); } };
  fab.addEventListener('click', toggleChat); chevron.addEventListener('click', toggleChat);
  phoneInput.addEventListener('input', function () { this.value = this.value.replace(/\D/g, '').substring(0, 11); });

  const getTime = () => { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; };
  const escapeHtml = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
  const addMessage = (text, sender) => {
    const row = document.createElement('div'); row.className = 'dcw-msg-row ' + sender;
    row.innerHTML = sender === 'agent'
      ? `<div class="dcw-msg-avatar"><img src="${AVATAR_URL}" alt="A" onerror="this.style.display='none';this.parentElement.textContent='A';"></div><div class="dcw-bubble-wrap"><div class="dcw-bubble">${escapeHtml(text)}</div><div class="dcw-msg-time">${getTime()}</div></div>`
      : `<div class="dcw-bubble-wrap"><div class="dcw-bubble">${escapeHtml(text)}</div><div class="dcw-msg-time">${getTime()}</div></div>`;
    messagesArea.appendChild(row); messagesArea.scrollTop = messagesArea.scrollHeight;
  };

  const showTyping = () => { typingEl.classList.remove('hidden'); messagesArea.scrollTop = messagesArea.scrollHeight; };
  const hideTyping = () => typingEl.classList.add('hidden');

  formBtn.addEventListener('click', async function () {
    const name = nameInput.value.trim(); const phone = phoneInput.value.trim(); let valid = true;
    nameErr.classList.remove('show'); phoneErr.classList.remove('show');
    if (!name) { nameErr.classList.add('show'); valid = false; }
    if (phone.length < 10) { phoneErr.classList.add('show'); valid = false; }
    if (!valid) return;

    userName = name; sessionId = 'desin_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    formBtn.disabled = true; formBtn.textContent = 'Conectando...';
    formScreen.classList.add('hidden'); connectingScreen.classList.remove('hidden');

    try {
      const reply = await sendToN8n({
        event: 'chat_started',
        action: 'start',
        sessionId,
        user: { name, phone },
        name,
        phone,
        message: 'Iniciar atendimento',
        chatInput: 'Iniciar atendimento',
        channel: 'website_widget',
        widget: 'desin_chat'
      });
      connectingScreen.classList.add('hidden'); chatScreen.classList.remove('hidden'); addMessage(reply || 'Olá! Como posso te ajudar?', 'agent'); chatInput.focus();
    } catch (_) {
      connectingScreen.classList.add('hidden'); chatScreen.classList.remove('hidden'); addMessage(`Olá, ${name}! Como posso te ajudar hoje?`, 'agent'); chatInput.focus();
    }
  });

  const sendMessage = async () => {
    const text = chatInput.value.trim(); if (!text) return;
    chatInput.value = ''; addMessage(text, 'user'); showTyping();
    try {
      const reply = await sendToN8n({
        event: 'chat_message',
        action: 'sendMessage',
        sessionId,
        user: { name: userName },
        name: userName,
        message: text,
        chatInput: text,
        channel: 'website_widget',
        widget: 'desin_chat'
      });
      hideTyping(); addMessage(reply || 'Desculpe, tente novamente.', 'agent');
    } catch (_) {
      hideTyping(); addMessage('Desculpe, ocorreu um erro. Tente novamente.', 'agent');
    }
  };

  sendBtn.addEventListener('click', sendMessage);
  chatInput.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
})();
</script>
